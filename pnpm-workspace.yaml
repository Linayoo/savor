packages:
  - "apps/*"
  - "packages/*"

# React Native and Metro work most reliably with a flat node_modules
nodeLinker: hoisted

# unrs-resolver (via eslint-config-expo) ships its native binding as an
# optional dependency, so its postinstall fallback isn't needed
allowBuilds:
  unrs-resolver: false
  # @parcel/watcher (via jest) also ships prebuilt bindings as optional dependencies
  "@parcel/watcher": false
  # esbuild (via drizzle-kit) gets its binary from optional platform packages
  esbuild: false
  # eas-cli's dependencies: dtrace-provider is an optional DTrace binding and
  # protobufjs's postinstall only checks versions; neither is needed to run eas
  dtrace-provider: false
  protobufjs: false
