name: Release iOS app

# Pushing a tag mobile-vX.Y.Z builds the release app on EAS and uploads it to
# TestFlight (spec 008). The "What to Test" note is written in App Store
# Connect: EAS sends it only on its Enterprise plan. EXPO_TOKEN is the only
# secret; signing credentials and the App Store Connect API key live in EAS.
on:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: read

concurrency:
  group: release-mobile
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/checks.yml

  version:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app's version
        run: |
          tag_version="${GITHUB_REF_NAME#mobile-v}"
          app_version="$(node -p 'require("./apps/mobile/package.json").version')"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app's version $app_version (apps/mobile/package.json)"
            exit 1
          fi

  release:
    needs: [check, version]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # eas-cli is a devDependency, the same version as locally
      - run: pnpm install --frozen-lockfile --filter @savor/mobile...
      - name: Build on EAS and submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm eas build --platform ios --profile production \
            --auto-submit --non-interactive
